<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR 字母著色學習卡 - 真實輪廓 3D 立體版</title>
  
  <!-- A-Frame & MindAR (開源免費 WebAR) -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      touch-action: none;
    }
    
    /* 頂部引導提示列 */
    #hud-top {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #f8fafc;
      padding: 9px 20px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
      pointer-events: none;
      white-space: nowrap;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #10b981;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.25); opacity: 0.6; }
    }

    /* 右上角：鏡頭擷取紙本塗鴉預覽小圖 */
    #preview-badge {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 999;
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid #3b82f6;
      border-radius: 12px;
      padding: 4px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.3s ease;
    }
    #preview-badge span {
      font-size: 10px;
      color: #93c5fd;
      font-weight: bold;
      margin-bottom: 2px;
    }
    #preview-canvas {
      width: 60px;
      height: 80px;
      border-radius: 6px;
      background: #fff;
      display: block;
      object-fit: cover;
    }

    /* 螢幕正下方觸控操作提示 */
    #touch-hint {
      position: fixed;
      bottom: 76px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      color: #fef08a;
      padding: 5px 14px;
      border-radius: 15px;
      font-size: 11px;
      font-weight: 500;
      z-index: 998;
      pointer-events: none;
      border: 1px solid rgba(254, 240, 138, 0.3);
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    /* 底部操作面板 */
    #hud-bottom {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      width: 94%;
      max-width: 440px;
    }
    .action-btn {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: #ffffff;
      border: none;
      padding: 9px 16px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35);
      display: flex;
      align-items: center;
      gap: 5px;
      transition: transform 0.1s ease;
    }
    .action-btn:active {
      transform: scale(0.94);
    }
    .btn-camera {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
    }
    .btn-green {
      background: linear-gradient(135deg, #10b981, #059669);
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
    }
    .btn-toggle {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #cbd5e1;
      font-size: 12px;
      padding: 7px 12px;
    }
    .btn-toggle.active {
      background: #4f46e5;
      color: #fff;
      border-color: #818cf8;
    }

    /* 吐司訊息提示 */
    #toast-msg {
      position: fixed;
      top: 66px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(16, 185, 129, 0.95);
      color: white;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .tap-sparkle {
      position: fixed;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0.5);
      animation: sparkleAnim 0.5s ease-out forwards;
      z-index: 1000;
    }
    @keyframes sparkleAnim {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(2.2); }
    }
  </style>
</head>
<body>

  <!-- 頂部即時提示 -->
  <div id="hud-top">
    <div class="status-dot"></div>
    <span id="instruction-text">請將鏡頭對準學習單「Aa」或「Bb」</span>
  </div>

  <!-- 右上角：鏡頭擷取紙本塗鴉預覽小圖 -->
  <div id="preview-badge">
    <span>🎨 採樣塗鴉</span>
    <canvas id="preview-canvas" width="120" height="160"></canvas>
  </div>

  <div id="toast-msg">✨ 提示訊息</div>

  <!-- 觸控互動提示 -->
  <div id="touch-hint">
    <span>👆</span><span>真實輪廓 3D 模型 • 點擊動物/字母互動 • 單指旋轉 • 雙指縮放</span>
  </div>

  <!-- 底部操作面板 -->
  <div id="hud-bottom">
    <button class="action-btn btn-camera" onclick="captureAndLockColoring()">
      <span>📸</span><span>拍下/鎖定塗鴉</span>
    </button>
    <button class="action-btn btn-green" onclick="playPhonicsAudio()">
      <span>🗣️</span><span id="btn-text">自然發音</span>
    </button>
    <button id="live-toggle-btn" class="action-btn btn-toggle active" onclick="toggleLiveSync()">
      <span>🔴</span><span>即時同步: 開</span>
    </button>
    <button class="action-btn btn-toggle" onclick="resetModelPose()">
      <span>🔄</span><span>重設角度</span>
    </button>
  </div>

  <!-- WebAR 3D 場景 -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; filterMinCF: 0.0005; filterBeta: 0.01;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights: true" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- ================= 標靶 0：Aa Alligator ================= -->
    <a-entity id="targetAa" mindar-image-target="targetIndex: 0">
      <!-- 3D 浮空立體真實字母 Aa -->
      <a-entity id="letterMeshAa" position="-0.26 0.45 0.15"></a-entity>

      <!-- 3D 鱷魚真形輪廓立體雕塑 -->
      <a-entity id="alligatorRotator" position="0 -0.15 0.12">
        <a-entity id="alligatorGroup" rotation="20 0 0">
          <!-- 沼澤半透明水波 -->
          <a-plane id="waterPlaneAa" opacity="0.65" width="1.0" height="0.85" position="0 -0.04 0" rotation="-90 0 0"></a-plane>
        </a-entity>
      </a-entity>
    </a-entity>

    <!-- ================= 標靶 1：Bb Bear ================= -->
    <a-entity id="targetBb" mindar-image-target="targetIndex: 1">
      <!-- 3D 浮空立體真實字母 Bb -->
      <a-entity id="letterMeshBb" position="-0.26 0.45 0.15"></a-entity>

      <!-- 3D 棕熊真形輪廓立體雕塑 -->
      <a-entity id="bearRotator" position="0 -0.1 0.12">
        <a-entity id="bearGroup" rotation="15 0 0">
          <a-plane id="waterPlaneBb" opacity="0.55" width="1.0" height="0.85" position="0 -0.04 0" rotation="-90 0 0"></a-plane>
        </a-entity>
      </a-entity>
    </a-entity>

  </a-scene>

  <!-- 核心運算：真實輪廓幾何生成、動態 UV 貼圖與觸控互動 -->
  <script>
    /* =========================================================
       1. 全域狀態與動態貼圖畫布
       ========================================================= */
    let activeTarget = 'Aa';
    let isTargetTracked = false;
    let isLiveSync = true;
    let videoEl = null;

    // 核心貼圖畫布
    const textureCanvas = document.createElement('canvas');
    textureCanvas.width = 512;
    textureCanvas.height = 680;
    const texCtx = textureCanvas.getContext('2d', { willReadFrequently: true });
    texCtx.fillStyle = '#ffffff';
    texCtx.fillRect(0, 0, 512, 680);

    const dynamicTexture = new THREE.CanvasTexture(textureCanvas);
    dynamicTexture.colorSpace = THREE.SRGBColorSpace || THREE.sRGBEncoding;

    // 縮圖畫布
    const previewCanvas = document.getElementById('preview-canvas');
    const prevCtx = previewCanvas.getContext('2d');

    const hudText = document.querySelector('#instruction-text');
    const btnText = document.querySelector('#btn-text');
    const clickableObjects = [];

    /* =========================================================
       2. 建立依據圖卡實際輪廓生成的 3D 模型 (ExtrudeGeometry)
       ========================================================= */
    const sceneEl = document.querySelector('a-scene');

    sceneEl.addEventListener('loaded', () => {
      buildOrganicAlligator();
      buildOrganicBear();
      buildOrganicLetters();
      setupTouchRaycaster();
    });

    // UV 座標自動映射到紙張指定百分比區間
    function remapContourUV(geom, uMin, vMin, uMax, vMax) {
      geom.computeBoundingBox();
      const bb = geom.boundingBox;
      const uv = geom.attributes.uv;
      const pos = geom.attributes.position;
      const width = bb.max.x - bb.min.x;
      const height = bb.max.y - bb.min.y;

      for (let i = 0; i < uv.count; i++) {
        const x = pos.getX(i);
        const y = pos.getY(i);
        const nx = Math.max(0, Math.min(1, (x - bb.min.x) / width));
        const ny = Math.max(0, Math.min(1, (y - bb.min.y) / height));

        // 轉換為紙張 UV (Canvas V 上下反轉)
        const u = uMin + nx * (uMax - uMin);
        const v = 1.0 - (vMin + ny * (vMax - vMin));
        uv.setXY(i, u, v);
      }
      uv.needsUpdate = true;
    }

    /* 2.1 建立真實鱷魚輪廓 3D 雕塑 */
    function buildOrganicAlligator() {
      const group = document.querySelector('#alligatorGroup').object3D;
      const mat = new THREE.MeshStandardMaterial({
        map: dynamicTexture,
        roughness: 0.35,
        metalness: 0.05
      });

      // 嚴格依據 alphabet_ab_single_page.pdf 鱷魚外形描繪路徑
      const gatorShape = new THREE.Shape();
      gatorShape.moveTo(-0.48, 0.02); // 嘴尖
      gatorShape.quadraticCurveTo(-0.42, 0.06, -0.32, 0.08); // 吻部拱起
      gatorShape.quadraticCurveTo(-0.25, 0.12, -0.22, 0.13); // 眼睛凸起
      gatorShape.quadraticCurveTo(-0.18, 0.11, -0.12, 0.11); // 後頸部
      
      // 背部骨板角質突起 (Serrated Scutes)
      gatorShape.lineTo(-0.06, 0.13);
      gatorShape.lineTo(-0.02, 0.11);
      gatorShape.lineTo( 0.04, 0.13);
      gatorShape.lineTo( 0.08, 0.11);
      gatorShape.lineTo( 0.14, 0.12);
      gatorShape.lineTo( 0.18, 0.10);
      gatorShape.lineTo( 0.24, 0.11);

      // 漸細長尾巴
      gatorShape.quadraticCurveTo(0.38, 0.08, 0.48, 0.04);
      gatorShape.lineTo(0.55, 0.01); // 尾尖
      gatorShape.quadraticCurveTo(0.44, -0.04, 0.30, -0.06);

      // 後腿 (粗壯腳掌)
      gatorShape.lineTo(0.24, -0.16);
      gatorShape.quadraticCurveTo(0.18, -0.18, 0.15, -0.16);
      gatorShape.lineTo(0.18, -0.06);

      // 腹部下曲線
      gatorShape.quadraticCurveTo(0.05, -0.06, -0.05, -0.06);

      // 前腿 (帶有腳趾爪子)
      gatorShape.lineTo(-0.10, -0.16);
      gatorShape.quadraticCurveTo(-0.16, -0.18, -0.19, -0.16);
      gatorShape.lineTo(-0.15, -0.04);

      // 下顎喉部回到嘴尖
      gatorShape.quadraticCurveTo(-0.30, -0.03, -0.44, -0.01);
      gatorShape.lineTo(-0.48, 0.02);

      // 擠出 3D 實體厚度，加上導角使邊緣圓潤
      const extrudeSettings = {
        depth: 0.12,
        bevelEnabled: true,
        bevelSegments: 4,
        steps: 2,
        bevelSize: 0.02,
        bevelThickness: 0.025
      };

      const gatorGeom = new THREE.ExtrudeGeometry(gatorShape, extrudeSettings);
      // 對應圖卡鱷魚區 U: 0.10 ~ 0.90, V: 0.50 ~ 0.85
      remapContourUV(gatorGeom, 0.10, 0.50, 0.90, 0.85);

      const gatorMesh = new THREE.Mesh(gatorGeom, mat);
      gatorMesh.name = "organic_alligator";
      gatorMesh.position.set(0, 0, -0.06);
      group.add(gatorMesh);
      clickableObjects.push(gatorMesh);

      // 鱷魚立體金黃眼珠
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0xfef08a });
      const pupilMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.022, 10, 10), eyeMat);
      eye.position.set(-0.23, 0.11, 0.08);
      const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.010, 8, 8), pupilMat);
      pupil.position.set(-0.235, 0.11, 0.098);
      group.add(eye);
      group.add(pupil);

      // 沼澤水面
      const waterEl = document.querySelector('#waterPlaneAa');
      if (waterEl) {
        waterEl.addEventListener('loaded', () => {
          const wMesh = waterEl.getObject3D('mesh');
          if (wMesh) {
            wMesh.material = new THREE.MeshBasicMaterial({
              map: dynamicTexture,
              transparent: true,
              opacity: 0.75
            });
            wMesh.name = "water";
            clickableObjects.push(wMesh);
          }
        });
      }
    }

    /* 2.2 建立真實棕熊輪廓 3D 雕塑 */
    function buildOrganicBear() {
      const group = document.querySelector('#bearGroup').object3D;
      const mat = new THREE.MeshStandardMaterial({
        map: dynamicTexture,
        roughness: 0.5,
        metalness: 0.05
      });

      // 依據圖卡棕熊身形曲線描繪
      const bearShape = new THREE.Shape();
      bearShape.moveTo(-0.30, -0.10); // 口鼻底部
      bearShape.quadraticCurveTo(-0.35, -0.02, -0.32, 0.04); // 口鼻尖端
      bearShape.quadraticCurveTo(-0.24, 0.08, -0.19, 0.14); // 額頭與鼻樑
      
      // 圓耳朵
      bearShape.quadraticCurveTo(-0.21, 0.23, -0.15, 0.25);
      bearShape.quadraticCurveTo(-0.11, 0.24, -0.12, 0.18);

      // 頸背肌肉隆起 (Shoulder Hump)
      bearShape.quadraticCurveTo(-0.06, 0.23, 0.02, 0.24);
      // 渾厚熊背
      bearShape.quadraticCurveTo(0.18, 0.22, 0.32, 0.14);
      
      // 臀部與小短尾巴
      bearShape.lineTo(0.38, 0.08);
      bearShape.lineTo(0.40, 0.05); // 尾巴
      bearShape.quadraticCurveTo(0.36, -0.02, 0.32, -0.06);

      // 後腿 (大腿厚實、腳掌著地)
      bearShape.lineTo(0.28, -0.22);
      bearShape.quadraticCurveTo(0.22, -0.25, 0.18, -0.23);
      bearShape.lineTo(0.19, -0.08);

      // 肚子下緣
      bearShape.quadraticCurveTo(0.06, -0.08, -0.02, -0.06);

      // 前腿
      bearShape.lineTo(-0.07, -0.22);
      bearShape.quadraticCurveTo(-0.13, -0.25, -0.17, -0.23);
      bearShape.lineTo(-0.12, -0.03);

      // 喉部與下巴回到口鼻
      bearShape.quadraticCurveTo(-0.22, -0.12, -0.30, -0.10);

      const extrudeSettings = {
        depth: 0.16,
        bevelEnabled: true,
        bevelSegments: 4,
        steps: 2,
        bevelSize: 0.025,
        bevelThickness: 0.03
      };

      const bearGeom = new THREE.ExtrudeGeometry(bearShape, extrudeSettings);
      // 對應圖卡棕熊區 U: 0.12 ~ 0.90, V: 0.44 ~ 0.92
      remapContourUV(bearGeom, 0.12, 0.44, 0.90, 0.92);

      const bearMesh = new THREE.Mesh(bearGeom, mat);
      bearMesh.name = "organic_bear";
      bearMesh.position.set(0, 0, -0.08);
      group.add(bearMesh);
      clickableObjects.push(bearMesh);

      // 棕熊黑鼻頭與眼睛
      const noseMat = new THREE.MeshBasicMaterial({ color: 0x1e293b });
      const nose = new THREE.Mesh(new THREE.SphereGeometry(0.024, 8, 8), noseMat);
      nose.position.set(-0.33, 0.02, 0.10);
      group.add(nose);

      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.015, 8, 8), noseMat);
      eye.position.set(-0.20, 0.08, 0.10);
      group.add(eye);

      // 熊所踩踏的岩石地表
      const groundEl = document.querySelector('#waterPlaneBb');
      if (groundEl) {
        groundEl.addEventListener('loaded', () => {
          const gMesh = groundEl.getObject3D('mesh');
          if (gMesh) {
            gMesh.material = new THREE.MeshBasicMaterial({
              map: dynamicTexture,
              transparent: true,
              opacity: 0.65
            });
            gMesh.name = "ground";
            clickableObjects.push(gMesh);
          }
        });
      }
    }

    /* 2.3 建立真實字型鏤空立體字母 (Aa 與 Bb) */
    function buildOrganicLetters() {
      const mat = new THREE.MeshStandardMaterial({
        map: dynamicTexture,
        roughness: 0.3,
        metalness: 0.05
      });

      const extrudeSettings = {
        depth: 0.08,
        bevelEnabled: true,
        bevelSegments: 3,
        steps: 1,
        bevelSize: 0.015,
        bevelThickness: 0.015
      };

      // ----------------- 大寫 A -----------------
      const shapeA = new THREE.Shape();
      shapeA.moveTo(-0.16, -0.16);
      shapeA.lineTo(-0.04,  0.18);
      shapeA.lineTo( 0.04,  0.18);
      shapeA.lineTo( 0.16, -0.16);
      shapeA.lineTo( 0.08, -0.16);
      shapeA.lineTo( 0.04, -0.04);
      shapeA.lineTo(-0.04, -0.04);
      shapeA.lineTo(-0.08, -0.16);
      shapeA.closePath();

      // A 的中空三角形鏤空洞 (Hole)
      const holeA = new THREE.Path();
      holeA.moveTo( 0.0,   0.09);
      holeA.lineTo(-0.025, 0.02);
      holeA.lineTo( 0.025, 0.02);
      holeA.closePath();
      shapeA.holes.push(holeA);

      // 小寫 a
      const shape_a = new THREE.Shape();
      shape_a.moveTo(0.18, -0.16);
      shape_a.lineTo(0.24, -0.16);
      shape_a.lineTo(0.24,  0.03);
      shape_a.quadraticCurveTo(0.22, 0.08, 0.16, 0.08);
      shape_a.quadraticCurveTo(0.10, 0.08, 0.09, 0.03);
      shape_a.lineTo(0.09, -0.08);
      shape_a.quadraticCurveTo(0.12, -0.16, 0.18, -0.16);
      shape_a.closePath();

      const geomA = new THREE.ExtrudeGeometry([shapeA, shape_a], extrudeSettings);
      remapContourUV(geomA, 0.14, 0.08, 0.86, 0.44);

      const meshAa = new THREE.Mesh(geomA, mat);
      meshAa.name = "letter_Aa";
      document.querySelector('#letterMeshAa').object3D.add(meshAa);
      clickableObjects.push(meshAa);

      // ----------------- 大寫 B -----------------
      const shapeB = new THREE.Shape();
      shapeB.moveTo(-0.16, -0.16);
      shapeB.lineTo(-0.16,  0.18);
      shapeB.lineTo( 0.03,  0.18);
      shapeB.quadraticCurveTo(0.15, 0.18, 0.15, 0.04);
      shapeB.quadraticCurveTo(0.15, 0.00, 0.08, -0.01);
      shapeB.quadraticCurveTo(0.16, -0.02, 0.16, -0.10);
      shapeB.quadraticCurveTo(0.16, -0.16, 0.04, -0.16);
      shapeB.closePath();

      // B 的上下兩顆鏤空洞
      const holeB1 = new THREE.Path();
      holeB1.moveTo(-0.09,  0.04);
      holeB1.lineTo(-0.09,  0.12);
      holeB1.lineTo( 0.02,  0.12);
      holeB1.quadraticCurveTo(0.07, 0.12, 0.07, 0.08);
      holeB1.quadraticCurveTo(0.07, 0.04, 0.02, 0.04);
      holeB1.closePath();
      shapeB.holes.push(holeB1);

      const holeB2 = new THREE.Path();
      holeB2.moveTo(-0.09, -0.10);
      holeB2.lineTo(-0.09, -0.02);
      holeB2.lineTo( 0.03, -0.02);
      holeB2.quadraticCurveTo(0.08, -0.02, 0.08, -0.06);
      holeB2.quadraticCurveTo(0.08, -0.10, 0.03, -0.10);
      holeB2.closePath();
      shapeB.holes.push(holeB2);

      // 小寫 b
      const shape_b = new THREE.Shape();
      shape_b.moveTo(0.18, -0.16);
      shape_b.lineTo(0.18,  0.18);
      shape_b.lineTo(0.24,  0.18);
      shape_b.lineTo(0.24,  0.06);
      shape_b.quadraticCurveTo(0.33, 0.06, 0.33, -0.05);
      shape_b.quadraticCurveTo(0.33, -0.16, 0.24, -0.16);
      shape_b.closePath();

      const hole_b = new THREE.Path();
      hole_b.moveTo(0.24, -0.10);
      hole_b.lineTo(0.24, -0.00);
      hole_b.quadraticCurveTo(0.28, -0.00, 0.28, -0.05);
      hole_b.quadraticCurveTo(0.28, -0.10, 0.24, -0.10);
      hole_b.closePath();
      shape_b.holes.push(hole_b);

      const geomB = new THREE.ExtrudeGeometry([shapeB, shape_b], extrudeSettings);
      remapContourUV(geomB, 0.14, 0.08, 0.86, 0.44);

      const meshBb = new THREE.Mesh(geomB, mat);
      meshBb.name = "letter_Bb";
      document.querySelector('#letterMeshBb').object3D.add(meshBb);
      clickableObjects.push(meshBb);
    }

    /* =========================================================
       3. 觸控手勢系統 (Raycast 點擊 + 旋轉 + 縮放)
       ========================================================= */
    function setupTouchRaycaster() {
      const raycaster = new THREE.Raycaster();
      const mouseVec = new THREE.Vector2();

      let touchStartX = 0;
      let touchStartY = 0;
      let touchStartTime = 0;
      let isDragging = false;
      let initialPinchDist = 0;
      let initialScale = 1.0;

      function getActiveRotator() {
        const id = (activeTarget === 'Aa') ? '#alligatorRotator' : '#bearRotator';
        return document.querySelector(id)?.object3D;
      }

      window.addEventListener('pointerdown', (e) => {
        if (e.target.closest('#hud-top, #hud-bottom, #preview-badge, button')) return;
        touchStartX = e.clientX;
        touchStartY = e.clientY;
        touchStartTime = Date.now();
        isDragging = false;
      });

      window.addEventListener('pointermove', (e) => {
        if (!isTargetTracked) return;
        if (e.target.closest('#hud-top, #hud-bottom, #preview-badge, button')) return;

        const dx = e.clientX - touchStartX;
        const dy = e.clientY - touchStartY;

        if (Math.hypot(dx, dy) > 8) {
          isDragging = true;
          const rotator = getActiveRotator();
          if (rotator) {
            rotator.rotation.y += dx * 0.012;
          }
          touchStartX = e.clientX;
          touchStartY = e.clientY;
        }
      });

      window.addEventListener('pointerup', (e) => {
        if (e.target.closest('#hud-top, #hud-bottom, #preview-badge, button')) return;

        const touchDuration = Date.now() - touchStartTime;
        if (!isDragging && touchDuration < 350) {
          handleScreenTap(e.clientX, e.clientY);
        }
        isDragging = false;
      });

      window.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          initialPinchDist = Math.hypot(dx, dy);
          const rotator = getActiveRotator();
          if (rotator) initialScale = rotator.scale.x;
        }
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && initialPinchDist > 0) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const currentDist = Math.hypot(dx, dy);
          const factor = currentDist / initialPinchDist;
          const rotator = getActiveRotator();
          if (rotator) {
            const newScale = Math.max(0.6, Math.min(2.2, initialScale * factor));
            rotator.scale.set(newScale, newScale, newScale);
          }
        }
      }, { passive: true });

      function handleScreenTap(clientX, clientY) {
        if (!sceneEl.camera) return;

        mouseVec.x = (clientX / window.innerWidth) * 2 - 1;
        mouseVec.y = -(clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouseVec, sceneEl.camera);
        const intersects = raycaster.intersectObjects(clickableObjects, true);

        if (intersects.length > 0) {
          const hitObj = intersects[0].object;
          createSparkleEffect(clientX, clientY);
          triggerHapticFeedback();
          onObjectTapped(hitObj.name);
        }
      }
    }

    function onObjectTapped(name) {
      const toast = document.getElementById('toast-msg');

      if (name.includes('letter')) {
        const letterGroup = (activeTarget === 'Aa')
          ? document.querySelector('#letterMeshAa')
          : document.querySelector('#letterMeshBb');
        
        if (letterGroup) {
          letterGroup.setAttribute('animation__spin', {
            property: 'rotation',
            to: '0 360 0',
            dur: 800,
            easing: 'easeInOutBack'
          });
          setTimeout(() => { letterGroup.removeAttribute('animation__spin'); }, 850);
        }

        toast.innerText = (activeTarget === 'Aa') ? "✨ 點擊立體字母 Aa！" : "✨ 點擊立體字母 Bb！";
        showToast();
        playPhonicsAudio();

      } else if (name.includes('alligator')) {
        const gator = document.querySelector('#alligatorGroup').object3D;
        if (gator) {
          // 鱷魚彈跳與嘴部前傾咬合動畫
          gator.position.y = 0.08;
          gator.rotation.x = 0.45;
          setTimeout(() => {
            gator.position.y = 0;
            gator.rotation.x = 0.35;
          }, 350);
        }
        toast.innerText = "🐊 鱷魚咬合：Snap! Chomp!";
        showToast();
        speakPhonics("Snap! Chomp! Alligator!");

      } else if (name.includes('bear')) {
        const bear = document.querySelector('#bearGroup').object3D;
        if (bear) {
          // 棕熊站立咆哮動畫
          bear.rotation.x = -0.15;
          bear.position.y = 0.12;
          setTimeout(() => {
            bear.rotation.x = 0.26;
            bear.position.y = 0;
          }, 450);
        }
        toast.innerText = "🐻 棕熊咆哮：Growl!";
        showToast();
        speakPhonics("Roar! Bear!");

      } else if (name.includes('water') || name.includes('ground')) {
        toast.innerText = "💦 激起水花與落葉！";
        showToast();
        speakPhonics("Splash!");
      }
    }

    function triggerHapticFeedback() {
      if (navigator.vibrate) {
        navigator.vibrate(40);
      }
    }

    function createSparkleEffect(x, y) {
      const sparkle = document.createElement('div');
      sparkle.className = 'tap-sparkle';
      sparkle.style.left = x + 'px';
      sparkle.style.top = y + 'px';
      sparkle.style.background = `radial-gradient(circle, #facc15 0%, rgba(245,158,11,0) 70%)`;
      document.body.appendChild(sparkle);
      setTimeout(() => sparkle.remove(), 550);
    }

    function showToast() {
      const toast = document.getElementById('toast-msg');
      toast.style.opacity = '1';
      setTimeout(() => { toast.style.opacity = '0'; }, 1800);
    }

    function resetModelPose() {
      const rotAa = document.querySelector('#alligatorRotator')?.object3D;
      const rotBb = document.querySelector('#bearRotator')?.object3D;
      if (rotAa) {
        rotAa.rotation.set(0, 0, 0);
        rotAa.scale.set(1, 1, 1);
      }
      if (rotBb) {
        rotBb.rotation.set(0, 0, 0);
        rotBb.scale.set(1, 1, 1);
      }
      const toast = document.getElementById('toast-msg');
      toast.innerText = "🔄 已重設 3D 角色角度與大小！";
      showToast();
    }

    /* =========================================================
       4. 電腦視覺核心：相機即時透視萃取 (Homography Warp)
       ========================================================= */
    function getVideoElement() {
      if (!videoEl) {
        videoEl = document.querySelector('video');
      }
      return videoEl;
    }

    function extractPaperColoring() {
      const v = getVideoElement();
      if (!v || v.readyState < 2 || !v.videoWidth) return false;

      const targetEl = (activeTarget === 'Aa')
        ? document.querySelector('#targetAa')
        : document.querySelector('#targetBb');
      
      if (!targetEl || !targetEl.object3D.visible) return false;

      const camera = sceneEl.camera;
      const targetObj = targetEl.object3D;

      const halfW = 0.5;
      const halfH = 0.665;

      const localCorners = [
        new THREE.Vector3(-halfW,  halfH, 0),
        new THREE.Vector3( halfW,  halfH, 0),
        new THREE.Vector3( halfW, -halfH, 0),
        new THREE.Vector3(-halfW, -halfH, 0)
      ];

      const videoW = v.videoWidth;
      const videoH = v.videoHeight;
      const scrCorners = [];

      for (let i = 0; i < 4; i++) {
        const p = localCorners[i].clone();
        p.applyMatrix4(targetObj.matrixWorld);
        p.project(camera);

        const vx = (p.x * 0.5 + 0.5) * videoW;
        const vy = (-p.y * 0.5 + 0.5) * videoH;
        scrCorners.push({ x: vx, y: vy });
      }

      warpQuadToCanvas(v, scrCorners, textureCanvas);
      boostColorVibrancy(texCtx, textureCanvas.width, textureCanvas.height);
      dynamicTexture.needsUpdate = true;
      prevCtx.drawImage(textureCanvas, 0, 0, previewCanvas.width, previewCanvas.height);

      return true;
    }

    function warpQuadToCanvas(sourceImg, corners, targetCanvas) {
      const ctx = targetCanvas.getContext('2d');
      const W = targetCanvas.width;
      const H = targetCanvas.height;
      const N = 3;

      ctx.clearRect(0, 0, W, H);

      for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
          const u0 = c / N, u1 = (c + 1) / N;
          const v0 = r / N, v1 = (r + 1) / N;

          const dx0 = u0 * W, dy0 = v0 * H;
          const dx1 = u1 * W, dy1 = v0 * H;
          const dx2 = u1 * W, dy2 = v1 * H;
          const dx3 = u0 * W, dy3 = v1 * H;

          const s0 = bilerp(corners, u0, v0);
          const s1 = bilerp(corners, u1, v0);
          const s2 = bilerp(corners, u1, v1);
          const s3 = bilerp(corners, u0, v1);

          drawAffineTriangle(ctx, sourceImg, dx0, dy0, dx1, dy1, dx3, dy3, s0.x, s0.y, s1.x, s1.y, s3.x, s3.y);
          drawAffineTriangle(ctx, sourceImg, dx1, dy1, dx2, dy2, dx3, dy3, s1.x, s1.y, s2.x, s2.y, s3.x, s3.y);
        }
      }
    }

    function bilerp(c, u, v) {
      const topX = (1 - u) * c[0].x + u * c[1].x;
      const topY = (1 - u) * c[0].y + u * c[1].y;
      const btmX = (1 - u) * c[3].x + u * c[2].x;
      const btmY = (1 - u) * c[3].y + u * c[2].y;
      return {
        x: (1 - v) * topX + v * btmX,
        y: (1 - v) * topY + v * btmY
      };
    }

    function drawAffineTriangle(ctx, img, dx0, dy0, dx1, dy1, dx2, dy2, sx0, sy0, sx1, sy1, sx2, sy2) {
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(dx0, dy0);
      ctx.lineTo(dx1, dy1);
      ctx.lineTo(dx2, dy2);
      ctx.closePath();
      ctx.clip();

      const denom = (sx0 * (sy1 - sy2) - sx1 * sy0 + sx2 * sy0 + sx1 * sy2 - sx2 * sy1);
      if (Math.abs(denom) > 1e-5) {
        const a = (dx0 * (sy1 - sy2) + dx1 * (sy2 - sy0) + dx2 * (sy0 - sy1)) / denom;
        const c = (dx0 * (sx2 - sx1) + dx1 * (sx0 - sx2) + dx2 * (sx1 - sx0)) / denom;
        const e = (dx0 * (sx1 * sy2 - sx2 * sy1) + dx1 * (sx2 * sy0 - sx0 * sy2) + dx2 * (sx0 * sy1 - sx1 * sy0)) / denom;

        const b = (dy0 * (sy1 - sy2) + dy1 * (sy2 - sy0) + dy2 * (sy0 - sy1)) / denom;
        const d = (dy0 * (sx2 - sx1) + dy1 * (sx0 - sx2) + dy2 * (sx1 - sx0)) / denom;
        const f = (dy0 * (sx1 * sy2 - sx2 * sy1) + dy1 * (sx2 * sy0 - sx0 * sy2) + dy2 * (sx0 * sy1 - sx1 * sy0)) / denom;

        ctx.transform(a, b, c, d, e, f);
        ctx.drawImage(img, 0, 0);
      }
      ctx.restore();
    }

    function boostColorVibrancy(ctx, w, h) {
      const imgData = ctx.getImageData(0, 0, w, h);
      const data = imgData.data;
      for (let i = 0; i < data.length; i += 4) {
        let r = data[i], g = data[i+1], b = data[i+2];
        r = ((r / 255 - 0.5) * 1.25 + 0.5) * 255;
        g = ((g / 255 - 0.5) * 1.25 + 0.5) * 255;
        b = ((b / 255 - 0.5) * 1.25 + 0.5) * 255;
        data[i]   = Math.min(255, Math.max(0, r));
        data[i+1] = Math.min(255, Math.max(0, g));
        data[i+2] = Math.min(255, Math.max(0, b));
      }
      ctx.putImageData(imgData, 0, 0);
    }

    /* =========================================================
       5. 輪詢排程與事件監聽
       ========================================================= */
    let lastExtractTime = 0;
    function animLoop(time) {
      if (isTargetTracked && isLiveSync) {
        if (time - lastExtractTime > 160) {
          extractPaperColoring();
          lastExtractTime = time;
        }
      }
      requestAnimationFrame(animLoop);
    }
    requestAnimationFrame(animLoop);

    const targetAa = document.querySelector('#targetAa');
    const targetBb = document.querySelector('#targetBb');

    targetAa.addEventListener("targetFound", () => {
      activeTarget = 'Aa';
      isTargetTracked = true;
      hudText.innerHTML = "🐊 <b>鎖定成功：Alligator (真實輪廓雕塑)</b>";
      btnText.innerText = "自然發音 Aa";
      setTimeout(extractPaperColoring, 100);
      speakPhonics("A is for Alligator!");
    });

    targetAa.addEventListener("targetLost", () => {
      isTargetTracked = false;
      hudText.innerHTML = "請將鏡頭對準學習單「Aa」或「Bb」";
    });

    targetBb.addEventListener("targetFound", () => {
      activeTarget = 'Bb';
      isTargetTracked = true;
      hudText.innerHTML = "🐻 <b>鎖定成功：Bear (真實輪廓雕塑)</b>";
      btnText.innerText = "自然發音 Bb";
      setTimeout(extractPaperColoring, 100);
      speakPhonics("B is for Bear!");
    });

    targetBb.addEventListener("targetLost", () => {
      isTargetTracked = false;
      hudText.innerHTML = "請將鏡頭對準學習單「Aa」或「Bb」";
    });

    function captureAndLockColoring() {
      const ok = extractPaperColoring();
      const toast = document.getElementById('toast-msg');
      if (ok) {
        toast.innerText = `✨ 已鎖定「${activeTarget === 'Aa' ? '鱷魚' : '棕熊'}」真形輪廓塗鴉！`;
        showToast();
        triggerHapticFeedback();
        speakPhonics("Great coloring!");
      } else {
        toast.innerText = "請先對準學習單進行辨識！";
        showToast();
      }
    }

    function toggleLiveSync() {
      isLiveSync = !isLiveSync;
      const btn = document.getElementById('live-toggle-btn');
      if (isLiveSync) {
        btn.classList.add('active');
        btn.innerHTML = '<span>🔴</span><span>即時同步: 開</span>';
      } else {
        btn.classList.remove('active');
        btn.innerHTML = '<span>⏸️</span><span>即時同步: 暫停</span>';
      }
    }

    function speakPhonics(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'en-US';
        msg.rate = 0.88;
        window.speechSynthesis.speak(msg);
      }
    }

    function playPhonicsAudio() {
      if (activeTarget === 'Aa') {
        speakPhonics("A says /æ/, /æ/, /æ/... Alligator!");
      } else {
        speakPhonics("B says /b/, /b/, /b/... Bear!");
      }
    }
  </script>
